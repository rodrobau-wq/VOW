# Blueprint do Render — https://render.com/docs/blueprint-spec
# Deploy: New > Blueprint > aponte para github.com/rodrobau-wq/VOW

databases:
  - name: vow-db
    databaseName: vow
    user: vow
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: vow-abras
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true

    # O disco continua montado só enquanto a migração para o Postgres não
    # tiver rodado em produção. Os leads capturados antes da troca moram nele,
    # e o boot os importa uma única vez. Remover o disco antes disso apaga
    # captura de cliente. Depois de confirmada a migração, este bloco sai.
    disk:
      name: vow-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # A persistência agora é banco. As duas variáveis abaixo só apontam
      # para os arquivos antigos, que a migração lê uma vez.
      - key: DATABASE_URL
        fromDatabase:
          name: vow-db
          property: connectionString
      - key: LEADS_DB
        value: /var/data/leads.json
      - key: APP_DB
        value: /var/data/db.json
      # Assina o cookie de sessão. Gerado uma vez pelo Render e mantido entre
      # deploys — se mudar, todo mundo é deslogado.
      - key: SESSION_SECRET
        generateValue: true
      # Definir no dashboard do Render (sync:false = não versionados)
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
      - key: LEADS_USER
        sync: false
      - key: LEADS_PASSWORD
        sync: false
      # Primeiro acesso à plataforma. Só tem efeito enquanto não existir
      # nenhum usuário — depois do primeiro login, é ignorado para sempre.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
      # Dono da plataforma (papel `deus`): a conta não pode ser rebaixada nem
      # desativada pela tela de equipe. Diferente das de cima, esta é lida a
      # cada boot — só promove uma conta que já existe, nunca define senha.
      # Em branco, cai no ADMIN_EMAIL.
      - key: SUPERADMIN_EMAIL
        sync: false
