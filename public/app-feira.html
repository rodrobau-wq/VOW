<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feira · VOW Campo</title>
<meta name="theme-color" content="#0E1B14">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<style>
  main{padding:18px 18px 90px;max-width:720px;margin:0 auto}
  h1{font-size:32px;margin:0 0 4px} h1 em{font-style:italic;color:var(--gold)}
  .sub{color:var(--muted);font-size:14.5px;margin:0 0 20px}

  .placar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
  .p{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 12px}
  .p .r{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);line-height:1.3}
  .p .v{font-family:var(--serif);font-size:26px;line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}
  .p.urg .v{color:var(--risk)}
  @media(max-width:560px){.placar{grid-template-columns:repeat(2,1fr)}}

  h2{font-size:20px;margin:0 0 4px}
  .leg{font-size:13px;color:var(--muted);margin:0 0 12px}
  .lista{display:flex;flex-direction:column;gap:8px}
  .card{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);
        border-radius:var(--r-md);padding:14px 16px;text-decoration:none;color:inherit}
  .card.quente{border-left:3px solid var(--gold)}
  .card .id{flex:1;min-width:0}
  .card .emp{font-weight:500;font-size:15px;line-height:1.3}
  .card .det{font-size:12.5px;color:var(--faint);margin-top:3px}
  .card .dir{text-align:right;flex:0 0 auto}
  .card .v{font-family:var(--serif);font-size:20px;font-variant-numeric:tabular-nums}
  .card .q{font-size:11.5px;color:var(--muted);margin-top:2px}
  .selo{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:500;margin-left:6px}
  .selo.novo{background:var(--gold-wash);color:var(--gold-deep)}
  .selo.conversa{background:rgba(47,122,85,.14);color:var(--ok)}
  .vazio{color:var(--faint);font-size:14px;padding:22px 0;text-align:center}

  /* Botão fixo: o consultor está de pé, com uma mão ocupada. */
  .fixo{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));
        background:linear-gradient(180deg,transparent,var(--bg) 34%);display:flex;gap:10px}
  .fixo .btn{flex:1;height:56px;font-size:16.5px;border-radius:var(--r-md);text-decoration:none;
             display:inline-flex;align-items:center;justify-content:center}
  .instalar{position:fixed;left:18px;right:18px;bottom:84px;background:var(--raised);
            border:1px solid var(--gold-edge);border-radius:var(--r-md);padding:14px 16px;
            display:flex;gap:12px;align-items:center;font-size:13.5px;color:var(--dim)}
  .instalar button{flex:0 0 auto}
</style>
</head>
<body>
<main>
  <h1>Modo <em>feira</em></h1>
  <p class="sub">Quem acabou de simular no totem ainda está no pavilhão.</p>
  <div class="placar" id="placar"></div>

  <h2>Acabaram de simular</h2>
  <p class="leg">Últimas 2 horas, mais recente primeiro. Quem ainda não foi abordado vem
  marcado.</p>
  <div class="lista" id="lista"><div class="vazio">Carregando…</div></div>
</main>

<div class="instalar" id="instalar" hidden>
  <span>Instale no celular para abrir sem navegador e funcionar sem rede.</span>
  <button class="btn" id="btn-instalar">Instalar</button>
</div>

<div class="fixo">
  <a class="btn lg" href="/app/capturar">Capturar lead</a>
  <a class="btn lg ghost" href="/app/hoje">Hoje</a>
</div>

<script type="module">
import { montarNav, esc, brlCurto, ligarApp, faixaRede } from '/app-nav.js'
import { sincronizarSempre } from '/fila-offline.js'

ligarApp()
const mostrarRede = faixaRede()
await montarNav('/app/feira')
sincronizarSempre((estado) => { mostrarRede(estado); if (estado.enviados) carregar() })

const $ = (id) => document.getElementById(id)
const minutos = (iso) => Math.floor((Date.now() - new Date(iso).getTime()) / 60000)
const agora = (iso) => {
  const m = minutos(iso)
  return m < 1 ? 'agora' : m < 60 ? `há ${m} min` : `há ${Math.floor(m / 60)} h`
}

async function carregar() {
  let d
  try {
    d = await (await fetch('/api/app/crm/feira?minutos=120')).json()
  } catch {
    // A API nunca vem do cache: sem rede a tela diz isso, em vez de mostrar
    // um movimento de horas atrás como se fosse de agora.
    $('lista').innerHTML = '<div class="vazio">Sem conexão. A lista volta quando a rede voltar.</div>'
    return
  }

  $('placar').innerHTML = `
    <div class="p"><div class="r">Hoje</div><div class="v">${d.hoje.total}</div></div>
    <div class="p"><div class="r">No totem</div><div class="v">${d.hoje.totem}</div></div>
    <div class="p ${d.naoAbordados ? 'urg' : ''}"><div class="r">Não abordados</div>
      <div class="v">${d.naoAbordados}</div></div>
    <div class="p"><div class="r">Em jogo hoje</div><div class="v">${brlCurto(d.hoje.valorEmJogo)}</div></div>`

  $('lista').innerHTML = d.recentes.map((l) => {
    const novo = l.origem === 'abras' && !l.primeiroContatoEm
    return `<a class="card ${novo ? 'quente' : ''}" href="/app/leads/${l.id}">
      <div class="id">
        <div class="emp">${esc(l.empresa || l.nome || 'Sem empresa')}
          ${novo ? '<span class="selo novo">não abordado</span>' : ''}
          ${l.agendar ? '<span class="selo conversa">pediu conversa</span>' : ''}</div>
        <div class="det">${esc(l.nome || l.email || '')} · ${agora(l.criadoEm)}${l.origem === 'abras' ? ' · totem' : ' · site'}</div>
      </div>
      <div class="dir"><div class="v">${brlCurto(l.valorEmJogo)}</div>
        <div class="q">${esc(l.estagioNome)}</div></div>
    </a>`
  }).join('') || '<div class="vazio">Ninguém simulou nas últimas 2 horas.</div>'
}

// Convite de instalação: só aparece se o navegador ofereceu de fato.
let prompt = null
addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); prompt = e; $('instalar').hidden = false
})
$('btn-instalar').addEventListener('click', async () => {
  $('instalar').hidden = true
  if (prompt) { prompt.prompt(); prompt = null }
})

carregar()
setInterval(carregar, 20000)
</script>
</body>
</html>
