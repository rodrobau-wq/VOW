<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova senha · Plataforma VOW</title>


<link rel="stylesheet" href="/tokens.css">
<style>
  body{min-height:100dvh;display:grid;place-items:center;padding:24px}
  .caixa{width:100%;max-width:420px}
  .topo{display:flex;align-items:center;gap:12px;margin-bottom:34px}
  h1{font-size:36px;margin-bottom:8px}
  h1 em{font-style:italic;color:var(--acento)}
  .sub{color:var(--muted);font-size:15px;margin-bottom:28px}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 8px}
  input{height:52px;width:100%;border-radius:var(--r-sm);border:1px solid var(--line-2);
        background:var(--surface);color:var(--ink);padding:0 16px;font:400 16px/1 var(--fonte)}
  input:focus{border-color:var(--acento);outline:none}
  .regra{font-size:13px;color:var(--faint);margin:10px 0 20px;display:flex;gap:8px;align-items:center}
  .regra.ok{color:var(--ok)}
  .btn{width:100%}
  .msg{font-size:14px;margin-top:14px;min-height:20px;color:var(--risco)}
  .msg.ok{color:var(--ok)}
  .volta{margin-top:26px;text-align:center;font-size:13px}
  .volta a{color:var(--muted)}
</style>
</head>
<body>
  <div class="caixa">
    <div class="topo">
      <img class="marca-caduceu" src="/marca/caduceu.jpg" alt="Grupo VOW">
      <div><span class="logo" style="font-size:21px">VOW</span>
        <div class="eyebrow" style="font-size:10px">Plataforma</div></div>
    </div>

    <h1>Escolha uma <em>senha nova</em></h1>
    <p class="sub">Ao salvar, você já entra. O link que te trouxe aqui deixa de funcionar.</p>

    <form id="f">
      <label for="senha">Nova senha</label>
      <span class="senha-campo">
        <input id="senha" type="password" autocomplete="new-password" placeholder="••••••••••" required>
        <button type="button" class="olho" id="olho" aria-pressed="false"
                aria-label="Mostrar a senha" aria-controls="senha"></button>
      </span>
      <div class="regra" id="regra"><span id="marca">○</span><span id="texto"></span></div>
      <button class="btn lg" id="btn" type="submit" disabled>Salvar e entrar</button>
    </form>

    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div class="volta"><a href="/app/entrar">← Voltar para o login</a></div>
  </div>

<script type="module">
const $ = (id) => document.getElementById(id)
const MINIMO = 10
const TOKEN = location.pathname.split('/').pop()

const OLHO = {
  fechado: '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>',
  aberto: '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/><path d="M3.5 3.5l17 17"/></svg>',
}
function ligarOlho(botao, campo) {
  const pintar = () => {
    const visivel = campo.type === 'text'
    botao.innerHTML = visivel ? OLHO.aberto : OLHO.fechado
    botao.setAttribute('aria-pressed', String(visivel))
    botao.setAttribute('aria-label', visivel ? 'Ocultar a senha' : 'Mostrar a senha')
  }
  botao.addEventListener('click', () => {
    campo.type = campo.type === 'password' ? 'text' : 'password'
    pintar(); campo.focus()
  })
  pintar()
}
ligarOlho($('olho'), $('senha'))

// A regra aparece antes de o servidor recusar: ninguém digita duas vezes.
function conferir() {
  const n = $('senha').value.length
  const ok = n >= MINIMO
  $('regra').className = 'regra' + (ok ? ' ok' : '')
  $('marca').textContent = ok ? '✓' : '○'
  $('texto').textContent = ok ? 'Tamanho suficiente.' : `Ao menos ${MINIMO} caracteres — faltam ${MINIMO - n}.`
  $('btn').disabled = !ok
}
$('senha').addEventListener('input', conferir)
conferir()

$('f').addEventListener('submit', async (e) => {
  e.preventDefault()
  $('btn').disabled = true
  $('msg').className = 'msg'; $('msg').textContent = ''
  try {
    const r = await fetch('/api/app/senha/redefinir', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, senha: $('senha').value }),
    })
    const j = await r.json()
    if (!r.ok) throw new Error(j.erro || 'não foi possível salvar')
    $('msg').className = 'msg ok'; $('msg').textContent = 'Senha trocada. Entrando…'
    location.href = j.destino
  } catch (err) {
    $('msg').textContent = err.message
    $('btn').disabled = false
  }
})
</script>
</body>
</html>
