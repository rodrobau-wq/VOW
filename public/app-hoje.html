<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hoje · Plataforma VOW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<style>
  main{padding:24px 28px 60px;max-width:960px;margin:0 auto}
  h1{font-size:38px;margin:0 0 4px} h1 em{font-style:italic;color:var(--gold)}
  .sub{color:var(--muted);font-size:15px;margin:0 0 26px}
  .grupo{margin-bottom:30px}
  .grupo h2{font-size:22px;margin:0 0 4px}
  .grupo .leg{font-size:13.5px;color:var(--muted);margin:0 0 14px}
  .item{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);
        border-radius:var(--r-md);padding:15px 18px;margin-bottom:8px;text-decoration:none;color:inherit}
  .item:hover{border-color:var(--gold-edge)}
  .item.urgente{border-left:3px solid var(--risk)}
  .item .id{flex:1;min-width:0}
  .item .emp{font-weight:500;font-size:15px}
  .item .det{font-size:12.5px;color:var(--faint);margin-top:3px}
  .item .dir{text-align:right;flex:0 0 auto}
  .item .v{font-family:var(--serif);font-size:20px;font-variant-numeric:tabular-nums}
  .item .q{font-size:12px;color:var(--muted);margin-top:2px}
  .vazio{color:var(--faint);font-size:14px;padding:14px 0}
  .conta{font-family:var(--serif);font-size:24px;color:var(--gold);margin-left:8px}
</style>
</head>
<body class="paper">
<main>
  <h1>O que precisa de <em>você</em> hoje</h1>
  <p class="sub">Só o que venceu, o que vence hoje e quem ninguém tocou ainda.</p>
  <div id="tudo" style=""><span style="color:var(--muted)">Carregando…</span></div>
</main>

<script type="module">
import { montarNav, esc, brlCurto, dataBr, parado } from '/app-nav.js'
await montarNav('/app/hoje')

const d = await (await fetch('/api/app/crm/hoje')).json()

const item = (l, detalhe, urgente) => `
  <a class="item ${urgente ? 'urgente' : ''}" href="/app/leads/${l.id}">
    <div class="id">
      <div class="emp">${esc(l.empresa || l.nome || 'Sem empresa')}</div>
      <div class="det">${esc(detalhe)}</div>
    </div>
    <div class="dir">
      <div class="v">${brlCurto(l.valorEmJogo)}</div>
      <div class="q">${esc(l.estagioNome)}</div>
    </div>
  </a>`

const grupo = (titulo, leg, lista, render, urgente) => `
  <section class="grupo">
    <h2>${titulo}<span class="conta">${lista.length}</span></h2>
    <p class="leg">${leg}</p>
    ${lista.length ? lista.map(render).join('') : '<div class="vazio">Nada aqui. Bom sinal.</div>'}
  </section>`

document.getElementById('tudo').innerHTML =
  grupo('Fora do prazo de contato',
    'Capturados há mais de 48 h e ninguém falou com eles. Ordenados pelo valor em jogo.',
    d.foraDoSla, (l) => item(l, `capturado ${parado(l.diasParado)}${l.agendar ? ' · pediu conversa' : ''}${l.origem === 'abras' ? ' · ABRAS' : ''}`, true), true) +
  grupo('Ações vencidas',
    'A data combinada já passou.',
    d.vencidas, (l) => item(l, `${esc(l.proximaAcao?.texto || '')} — era ${dataBr(l.proximaAcao?.quando)}`, true)) +
  grupo('Para hoje',
    'O que você mesmo marcou para hoje.',
    d.hoje, (l) => item(l, esc(l.proximaAcao?.texto || ''))) +
  grupo('Sem próxima ação',
    'Oportunidade aberta sem nada combinado. Está morta e ninguém percebeu.',
    d.semProximaAcao, (l) => item(l, `parado ${parado(l.diasParado)} em ${esc(l.estagioNome)}`))
</script>
</body>
</html>
