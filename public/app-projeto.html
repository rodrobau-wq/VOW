<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projeto · Plataforma VOW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<style>
  main{padding:24px 28px 60px;max-width:1080px;margin:0 auto}
  .volta{font-size:13.5px;color:var(--muted);text-decoration:none}
  .volta:hover{color:var(--ink)}
  h1{font-size:38px;margin:14px 0 4px} h1 em{font-style:italic;color:var(--gold)}
  .sub{color:var(--muted);font-size:15px;margin:0 0 22px}
  .sub a{color:var(--gold)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
  .k{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px}
  .k .r{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
  .k .v{font-family:var(--serif);font-size:30px;line-height:1;margin-top:7px;font-variant-numeric:tabular-nums}
  .k.risco .v{color:var(--risk)} .k.bom .v{color:var(--ok)}
  .k .p{font-size:12.5px;color:var(--faint);margin-top:5px;line-height:1.4}

  .grupo{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
         margin:26px 0 10px}
  .etapa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
         padding:20px 22px;margin-bottom:10px}
  .etapa.feita{border-color:rgba(47,122,85,.4)}
  .etapa.atrasada{border-left:3px solid var(--risk)}
  .etapa .cab{display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap}
  .etapa .n{font-family:var(--serif);font-size:20px;color:var(--gold);line-height:1}
  .etapa h3{font-size:20px;margin:0;font-family:var(--sans);font-weight:600}
  .etapa .desc{font-size:13.5px;color:var(--muted);margin:8px 0 14px;line-height:1.55;max-width:72ch}
  .campos{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.1fr;gap:10px;align-items:end}
  @media(max-width:820px){.campos{grid-template-columns:1fr 1fr}}
  .campo label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
               color:var(--muted);margin-bottom:5px}
  .campo input,.campo select{width:100%;padding:10px 12px;border:1px solid var(--line-2);
    border-radius:var(--r-sm);background:var(--raised);color:var(--ink);font:400 14px/1.3 var(--sans);outline:none}
  .campo input:focus,.campo select:focus{border-color:var(--gold)}
  .campo .obj{font-family:var(--serif);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
  .aviso{font-size:12.5px;color:var(--risk);margin-top:10px}
  .msg{font-size:13.5px;min-height:18px;margin-top:10px;color:var(--ok)}
  .nota{font-size:12.5px;color:var(--faint);line-height:1.6;margin-top:20px}
</style>
</head>
<body class="paper">
<main>
  <a class="volta" href="/app/projetos">← Projetos</a>
  <div id="tudo" style="padding:50px 0;"><span style="color:var(--muted)">Carregando…</span></div>
</main>

<script type="module">
import { montarNav, esc, brl, brlCurto, dataBr } from '/app-nav.js'
await montarNav('/app/projetos')

const $ = (id) => document.getElementById(id)
const ID = location.pathname.split('/').pop()
const hoje = new Date().toISOString().slice(0, 10)
const SITUACOES = ['prevista', 'em andamento', 'concluída', 'travada']
let dados = null

async function carregar() {
  dados = await (await fetch(`/api/app/projetos/${ID}`)).json()
  if (dados.erro) { $('tudo').textContent = dados.erro; return }
  pintar()
}

function pintar() {
  const { projeto: p, resumo: r, lead } = dados
  const porProduto = {}
  for (const e of p.etapas) (porProduto[e.produtoNome] ||= []).push(e)

  $('tudo').innerHTML = `
    <h1>${esc(p.nome)}</h1>
    <p class="sub">
      ${p.produtos.length} produto(s) · iniciado em ${dataBr(p.iniciadoEm)}
      ${lead ? ` · <a href="/app/leads/${lead.id}">ver a jornada comercial</a>` : ''}
    </p>

    <div class="kpis">
      <div class="k"><div class="r">A destravar</div><div class="v">${brlCurto(r.objetivoTotal)}</div>
        <div class="p">exposição do cliente. O honorário da VOW${p.honorario ? ' é ' + brl(p.honorario) : ''} é outro número.</div></div>
      <div class="k bom"><div class="r">Já entregue</div><div class="v">${brlCurto(r.entregue)}</div>
        <div class="p">${r.progressoFinanceiro}% do objetivo · ${r.concluidas} de ${r.total} etapas</div></div>
      <div class="k ${r.atrasadas ? 'risco' : ''}"><div class="r">Atrasadas</div><div class="v">${r.atrasadas}</div>
        <div class="p">${r.emRisco ? brlCurto(r.emRisco) + ' em risco' : 'nada fora do prazo'}</div></div>
      <div class="k ${r.semResponsavel ? 'risco' : ''}"><div class="r">Sem responsável</div>
        <div class="v">${r.semResponsavel}</div>
        <div class="p">${r.semResponsavel ? 'etapa sem dono não anda' : 'todas têm dono'}</div></div>
    </div>

    ${Object.entries(porProduto).map(([nome, etapas]) => `
      <div class="grupo">${esc(nome)}</div>
      ${etapas.map((e, i) => etapaHtml(e, i)).join('')}
    `).join('')}

    <p class="nota">Os prazos e os pesos vêm do padrão da metodologia VOW — a seção 5.1 dos
    briefs. São ponto de partida, não decisão tomada: ajuste o que o cliente exigir. O
    objetivo de cada etapa é a parcela da exposição do cliente que depende dela; somados,
    dão o valor em jogo do diagnóstico.</p>`

  for (const el of document.querySelectorAll('[data-etapa]')) {
    el.addEventListener('change', () => salvar(el.dataset.etapa))
  }
}

function etapaHtml(e, i) {
  const atrasada = e.status !== 'concluída' && e.prazo && e.prazo < hoje
  return `<article class="etapa ${e.status === 'concluída' ? 'feita' : ''} ${atrasada ? 'atrasada' : ''}">
    <div class="cab">
      <div style="display:flex;gap:12px;align-items:baseline">
        <span class="n">0${i + 1}</span><h3>${esc(e.nome)}</h3>
      </div>
      <div class="campo" style="text-align:right">
        <label>Objetivo (${e.peso}%)</label>
        <div class="obj">${brl(e.objetivo)}</div>
      </div>
    </div>
    <p class="desc">${esc(e.descricao)}</p>
    <div class="campos">
      <div class="campo"><label for="r-${e.id}">Responsável</label>
        <input id="r-${e.id}" data-etapa="${e.id}" data-campo="responsavel"
               value="${esc(e.responsavel || '')}" placeholder="Quem faz"></div>
      <div class="campo"><label for="p-${e.id}">Prazo</label>
        <input id="p-${e.id}" type="date" data-etapa="${e.id}" data-campo="prazo" value="${esc(e.prazo || '')}"></div>
      <div class="campo"><label for="o-${e.id}">Objetivo R$</label>
        <input id="o-${e.id}" type="number" min="0" step="1000" data-etapa="${e.id}" data-campo="objetivo"
               value="${Math.round(e.objetivo)}"></div>
      <div class="campo"><label for="s-${e.id}">Situação</label>
        <select id="s-${e.id}" data-etapa="${e.id}" data-campo="status">
          ${SITUACOES.map((x) => `<option value="${x}" ${x === e.status ? 'selected' : ''}>${x}</option>`).join('')}
        </select></div>
    </div>
    ${atrasada ? `<div class="aviso">Prazo venceu em ${dataBr(e.prazo)}.</div>` : ''}
    ${!e.responsavel && e.status !== 'concluída' ? '<div class="aviso">Sem responsável: ninguém vai puxar esta etapa.</div>' : ''}
  </article>`
}

async function salvar(etapaId) {
  const corpo = {}
  for (const el of document.querySelectorAll(`[data-etapa="${etapaId}"]`)) {
    corpo[el.dataset.campo] = el.dataset.campo === 'objetivo' ? Number(el.value) : el.value
  }
  const r = await fetch(`/api/app/projetos/${ID}/etapas/${etapaId}`, {
    method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify(corpo),
  })
  if (r.ok) { dados = { ...dados, ...(await r.json()) }; pintar() }
}

carregar()
</script>
</body>
</html>
