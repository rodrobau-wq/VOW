<!DOCTYPE html>
<html>
<head>
<base href="/abras/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#EFE9DB; }
  body { font-family:'IBM Plex Sans', system-ui, sans-serif; color:#0E1B14; -webkit-font-smoothing:antialiased; }
  a { color:#1C3225; } a:hover { color:#B8934A; }
  * { box-sizing:border-box; }
</style>
</helmet>
<div data-screen-label="Modelo de e-mail" style="min-height:100vh;display:grid;grid-template-columns:300px 1fr;background:#EFE9DB;color:#0E1B14;font-size:14px;line-height:1.4">
  <aside style="background:#0E1B14;color:#F3EEE2;padding:28px 22px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh">
    <div style="display:flex;align-items:baseline;gap:10px"><span style="font-family:'Instrument Serif',serif;font-size:28px;letter-spacing:0.04em">VOW</span><span style="font-size:11px;color:#9FB0A2;letter-spacing:0.14em;text-transform:uppercase">Modelo de e-mail</span></div>
    <p style="font-size:13px;color:#9FB0A2;margin:0;line-height:1.5">Gerado por <code style="color:#E0C48C">email.js</code> a partir do lead. É o mesmo HTML que o Render entrega ao Resend.</p>
    <div>
      <div style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#9FB0A2;margin-bottom:8px">Lead</div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <sc-for list="{{ opcoes }}" as="o" hint-placeholder-count="4">
          <button onClick="{{ o.onClick }}" style="height:44px;border-radius:10px;border:none;text-align:left;padding:0 12px;font-size:13px;cursor:pointer;background:{{ o.bg }};color:{{ o.cor }};font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ o.label }}</button>
        </sc-for>
      </div>
    </div>
    <div style="padding:14px;border-radius:12px;background:#15261C;font-size:13px;line-height:1.5"><div style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#9FB0A2;margin-bottom:6px">Assunto</div>{{ assunto }}</div>
    <button onClick="{{ copiar }}" style="height:44px;border-radius:10px;border:1px solid rgba(243,238,226,0.22);background:transparent;color:#F3EEE2;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit">{{ copiarLabel }}</button>
    <a href="Plataforma VOW Leads.dc.html" style="font-size:13px;color:#E0C48C">← Plataforma</a>
  </aside>
  <main style="padding:24px;display:flex;justify-content:center;align-items:flex-start">
    <div style="width:100%;max-width:680px;height:calc(100vh - 48px);border-radius:14px;overflow:hidden;border:1px solid rgba(14,27,20,0.10);background:#fff">{{ frame }}</div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { M: null, E: null, leads: [], sel: 0, copiado: false };
  componentDidMount() {
    Promise.all([import('./motor.js'), import('./email.js')]).then(([M, E]) => {
      M.seedDemo();
      const leads = M.carregarLeads().filter(l => l.resultado);
      const id = new URLSearchParams(location.search).get('lead');
      const sel = Math.max(0, leads.findIndex(l => l.id === id));
      this.setState({ M, E, leads, sel });
    });
  }
  renderVals() {
    const { M, E, leads, sel } = this.state;
    const L = leads[sel];
    const html = L && E ? E.emailHtml(L, { linkDiagnostico: M.linkDiagnostico(L, ''), linkContato: 'mailto:contato@vow.com.br' }) : '';
    return {
      opcoes: leads.map((l, i) => ({ label: `${l.nome} · ${l.produto === 'revenda' ? 'Revenda' : 'Indiretos'}`, bg: i === sel ? '#1C3225' : 'transparent', cor: i === sel ? '#F3EEE2' : '#C9D2C8', onClick: () => this.setState({ sel: i, copiado: false }) })),
      assunto: L && M ? M.assuntoEmail(L) : '',
      frame: html ? React.createElement('iframe', { key: L.id, srcDoc: html, title: 'Pré-visualização do e-mail', style: { width: '100%', height: '100%', border: 0 } }) : null,
      copiarLabel: this.state.copiado ? 'HTML copiado ✓' : 'Copiar HTML do e-mail',
      copiar: () => { navigator.clipboard.writeText(html).then(() => this.setState({ copiado: true })); },
    };
  }
}
</script>
</body>
</html>
